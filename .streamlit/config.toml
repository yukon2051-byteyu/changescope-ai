# 配色は changescope/theme.py で決める。下の色の行は「python -m changescope.theme <テーマの名前>」で書き換わるので、手で直さない
[theme]
base = "light"
font = "Noto Sans JP:https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap, Meiryo, sans-serif"
primaryColor = "#0E4F3A"
textColor = "#18211F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F3"
linkColor = "#0E4F3A"
linkUnderline = false
borderColor = "#DCE5E1"
dataframeBorderColor = "#E3EAE6"
dataframeHeaderBackgroundColor = "#F1F5F3"
showWidgetBorder = true
# ヘッダーの下の余白（標準は約6rem）。本文側はさらにCSS（changescope/ui.py）で上端近くまで詰めている
paddingTop = "0.75rem"
baseRadius = "medium"
buttonRadius = "full"
blueColor = "#0E4F3A"
blueBackgroundColor = "#E8F1EC"
blueTextColor = "#0E4F3A"

[theme.sidebar]
backgroundColor = "#F4F7F5"
secondaryBackgroundColor = "#E6EEEA"
textColor = "#2F3B37"
primaryColor = "#0E4F3A"
borderColor = "#DCE5E1"

[client]
# 右上の開発者向けボタン（Deploy など）を隠し、メニューだけにする
toolbarMode = "minimal"

[server]
# アップロード上限（MB）。CSV・Excelの検証側でも1MBを上限にしている
maxUploadSize = 1
