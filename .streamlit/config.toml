# 配色は changescope/theme.py で決める。下の色の行は「python -m changescope.theme <テーマの名前>」で書き換わるので、手で直さない
[theme]
base = "light"
font = "Noto Sans JP:https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap, Meiryo, sans-serif"
primaryColor = "#1E4A3D"
textColor = "#1F2622"
backgroundColor = "#F5F2EA"
secondaryBackgroundColor = "#ECE6D8"
linkColor = "#1E4A3D"
linkUnderline = false
borderColor = "#DED7C6"
dataframeBorderColor = "#E3DCCB"
dataframeHeaderBackgroundColor = "#ECE6D8"
showWidgetBorder = true
# ヘッダーの下の余白（標準は約6rem）。本文側はさらにCSS（changescope/ui.py）で上端近くまで詰めている
paddingTop = "0.75rem"
baseRadius = "small"
buttonRadius = "small"
blueColor = "#1E4A3D"
blueBackgroundColor = "#E4ECE7"
blueTextColor = "#16302A"

[theme.sidebar]
backgroundColor = "#16302A"
secondaryBackgroundColor = "#234238"
textColor = "#E3DCCB"
primaryColor = "#CDB07A"
borderColor = "#2B4A40"

[client]
# 右上の開発者向けボタン（Deploy など）を隠し、メニューだけにする
toolbarMode = "minimal"

[server]
# アップロード上限（MB）。CSV・Excelの検証側でも1MBを上限にしている
maxUploadSize = 1
