# 配色は changescope/theme.py で決める。下の色の行は「python -m changescope.theme <テーマの名前>」で書き換わるので、手で直さない
[theme]
base = "light"
font = "Noto Sans JP:https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap, Meiryo, sans-serif"
primaryColor = "#344C25"
textColor = "#20271C"
backgroundColor = "#F6F8F2"
secondaryBackgroundColor = "#EEF2E6"
linkColor = "#344C25"
linkUnderline = false
borderColor = "#DDE3D3"
dataframeBorderColor = "#E3E8DA"
dataframeHeaderBackgroundColor = "#EEF2E6"
showWidgetBorder = true
# ヘッダーの下の余白（標準は約6rem）。本文側はさらにCSS（changescope/ui.py）で上端近くまで詰めている
paddingTop = "0.75rem"
baseRadius = "medium"
buttonRadius = "full"
blueColor = "#344C25"
blueBackgroundColor = "#EDF4D6"
blueTextColor = "#344C25"

[theme.sidebar]
backgroundColor = "#F6F8F2"
secondaryBackgroundColor = "#E6EDD8"
textColor = "#2E3A27"
primaryColor = "#344C25"
borderColor = "#DDE3D3"

[client]
# 右上の開発者向けボタン（Deploy など）を隠し、メニューだけにする
toolbarMode = "minimal"

[server]
# アップロード上限（MB）。CSV・Excelの検証側でも1MBを上限にしている
maxUploadSize = 1
